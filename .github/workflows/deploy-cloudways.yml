name: Build and deploy to Cloudways

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the completed build to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudways-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application drafts
        run: npm run build:review

      - name: Build site
        run: npm run build

      - name: Save completed site
        uses: actions/upload-artifact@v7
        with:
          name: production-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Cloudways
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carlavidano.com

    steps:
      - name: Download completed site
        uses: actions/download-artifact@v8
        with:
          name: production-site
          path: site

      - name: Check deployment configuration
        env:
          CLOUDWAYS_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          CLOUDWAYS_USERNAME: ${{ secrets.CLOUDWAYS_USERNAME }}
          CLOUDWAYS_SSH_PRIVATE_KEY: ${{ secrets.CLOUDWAYS_SSH_PRIVATE_KEY }}
          CLOUDWAYS_KNOWN_HOSTS: ${{ secrets.CLOUDWAYS_KNOWN_HOSTS }}
          CLOUDWAYS_DEPLOY_PATH: ${{ vars.CLOUDWAYS_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            CLOUDWAYS_HOST \
            CLOUDWAYS_USERNAME \
            CLOUDWAYS_SSH_PRIVATE_KEY \
            CLOUDWAYS_KNOWN_HOSTS \
            CLOUDWAYS_DEPLOY_PATH
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub deployment setting: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        env:
          CLOUDWAYS_SSH_PRIVATE_KEY: ${{ secrets.CLOUDWAYS_SSH_PRIVATE_KEY }}
          CLOUDWAYS_KNOWN_HOSTS: ${{ secrets.CLOUDWAYS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLOUDWAYS_SSH_PRIVATE_KEY" > ~/.ssh/cloudways
          chmod 600 ~/.ssh/cloudways
          printf '%s\n' "$CLOUDWAYS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify Cloudways destination
        env:
          CLOUDWAYS_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          CLOUDWAYS_USERNAME: ${{ secrets.CLOUDWAYS_USERNAME }}
          CLOUDWAYS_DEPLOY_PATH: ${{ vars.CLOUDWAYS_DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/cloudways \
            -p 22 \
            "${CLOUDWAYS_USERNAME}@${CLOUDWAYS_HOST}" \
            "test -d '${CLOUDWAYS_DEPLOY_PATH}'"

      - name: Deploy completed site
        env:
          CLOUDWAYS_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          CLOUDWAYS_USERNAME: ${{ secrets.CLOUDWAYS_USERNAME }}
          CLOUDWAYS_DEPLOY_PATH: ${{ vars.CLOUDWAYS_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          rsync \
            --archive \
            --compress \
            --itemize-changes \
            --exclude='.DS_Store' \
            --exclude='.well-known/' \
            --exclude='.retired-applications.json' \
            -e "ssh -i ~/.ssh/cloudways -p 22" \
            site/ \
            "${CLOUDWAYS_USERNAME}@${CLOUDWAYS_HOST}:${CLOUDWAYS_DEPLOY_PATH}/"

          # Remove old article pages when their status changes back to draft.
          # Keep deletion scoped to the site's generated article directories.
          for section in drawing-board on-my-desk; do
            rsync \
              --archive \
              --compress \
              --delete \
              --itemize-changes \
              -e "ssh -i ~/.ssh/cloudways -p 22" \
              "site/${section}/" \
              "${CLOUDWAYS_USERNAME}@${CLOUDWAYS_HOST}:${CLOUDWAYS_DEPLOY_PATH}/${section}/"
          done

      - name: Remove retired applicant sites
        env:
          CLOUDWAYS_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          CLOUDWAYS_USERNAME: ${{ secrets.CLOUDWAYS_USERNAME }}
          CLOUDWAYS_DEPLOY_PATH: ${{ vars.CLOUDWAYS_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const retired = JSON.parse(fs.readFileSync('site/.retired-applications.json', 'utf8'));
          const protectedPaths = new Set(['main', 'about', 'portfolio', 'drawing-board', 'on-my-desk', '404', 'media']);
          if (!Array.isArray(retired) || retired.some(id =>
            typeof id !== 'string' || !/^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/.test(id) ||
            protectedPaths.has(id) || fs.existsSync(path.join('site', id))
          )) throw new Error('Refusing an invalid or active application removal target.');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'retired-applications.txt'), retired.map(id => id + '\n').join(''));
          NODE

          # Only remove named application directories, from the verified site root.
          # The JSON manifest remains in the build artifact, not on the public server.
          printf -v quoted_deploy_path '%q' "$CLOUDWAYS_DEPLOY_PATH"
          while IFS= read -r application; do
            ssh \
              -i ~/.ssh/cloudways \
              -p 22 \
              "${CLOUDWAYS_USERNAME}@${CLOUDWAYS_HOST}" \
              "cd ${quoted_deploy_path} && test -f index.html && rm -rf -- './${application}'"
          done < "${RUNNER_TEMP}/retired-applications.txt"
